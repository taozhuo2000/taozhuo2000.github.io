{% include base_path %}

<!-- start custom head snippets -->

<!-- Support for Academicons -->
<link rel="preload" href="{{ '/assets/css/academicons.min.css' | relative_url }}" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="{{ '/assets/css/academicons.min.css' | relative_url }}"></noscript>

<!-- Support for Font Awesome -->
 <link rel="preload" href="{{ '/assets/css/fontawesome.css' | relative_url }}" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="{{ '/assets/css/fontawesome.css' | relative_url }}"></noscript>

<!-- favicon from https://commons.wikimedia.org/wiki/File:OOjs_UI_icon_academic-progressive.svg -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ site.baseurl }}/images/apple-touch-icon-180x180.png"/>
<link rel="icon" type="image/svg+xml" href="{{ site.baseurl }}/images/favicon.svg"/>
<link rel="icon" type="image/png" href="{{ site.baseurl }}/images/favicon-32x32.png" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ site.baseurl }}/images/favicon-192x192.png" sizes="192x192"/>
<link rel="manifest" href="{{ site.baseurl }}/images/manifest.json"/>
<link rel="icon" href="{{ '/images/favicon.ico' | relative_url }}"/>
<meta name="theme-color" content="#f3eee8" media="(prefers-color-scheme: light)"/>
<meta name="theme-color" content="#1c2736" media="(prefers-color-scheme: dark)"/>

{% if page.alternate_url %}
  {% if page.lang == 'zh' %}
    <link rel="alternate" hreflang="en" href="{{ page.alternate_url | absolute_url }}" />
    <link rel="alternate" hreflang="zh-CN" href="{{ page.url | absolute_url }}" />
  {% else %}
    <link rel="alternate" hreflang="en" href="{{ page.url | absolute_url }}" />
    <link rel="alternate" hreflang="zh-CN" href="{{ page.alternate_url | absolute_url }}" />
  {% endif %}
{% endif %}

<!-- end custom head snippets -->
