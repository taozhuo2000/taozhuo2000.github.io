{% assign current_lang = page.lang | default: site.default_locale %}
{% if page.alternate_url %}
  {% if current_lang == 'zh' %}
    <a href="{{ page.alternate_url | relative_url }}" class="language-switcher__btn" lang="en" hreflang="en" aria-label="Switch to English">EN</a>
  {% else %}
    <a href="{{ page.alternate_url | relative_url }}" class="language-switcher__btn" lang="zh" hreflang="zh" aria-label="切换到中文">中文</a>
  {% endif %}
{% endif %}
